name: Validate
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Rust formatting
        run: cargo fmt -p codex-switch-core -p codex-switch-desktop --check
      - name: Verify vendored CC Switch sources
        run: pnpm check:upstream
      - name: Check frontend types
        run: pnpm check
      - name: Test desktop UI
        run: pnpm --filter @codex-switch/desktop test
      - name: Test routing and protocol compatibility
        run: cargo test --locked -p codex-switch-core -p cc-switch-codex
      - name: Lint Rust
        run: cargo clippy --locked -p codex-switch-core --all-targets --no-deps -- -D warnings
      - name: Build desktop frontend and website
        env:
          # An isolated SEO fixture, not the production domain.
          PUBLIC_SITE_URL: https://codex-switch.test
          PUBLIC_SITE_INDEXABLE: 'false'
        run: pnpm build
      - name: Check website links
        run: pnpm check:links
      - name: Check deployment routes and bilingual 404s
        run: pnpm check:deployment
      - name: Check bilingual website SEO
        run: pnpm check:seo -- --require-site --expect-noindex
      - name: Scan source and artifacts for credentials
        run: python3 scripts/check_secrets.py --artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: apps/website/dist
          if-no-files-found: error
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: ''
            artifact: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: '--config src-tauri/tauri.windows.conf.json'
            artifact: target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned installer
        run: pnpm --filter @codex-switch/desktop tauri build --ci ${{ matrix.args }} -- --locked
      - name: Test native coordinator
        run: cargo test --locked -p codex-switch-desktop
      - name: Scan source and artifacts for credentials
        run: python scripts/check_secrets.py --artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-unsigned
          path: ${{ matrix.artifact }}
          if-no-files-found: error
