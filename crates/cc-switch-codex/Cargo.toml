[package]
name = "cc-switch-codex"
version = "0.1.0"
publish = false
edition = "2021"
license = "MIT"
description = "Vendored CC Switch Codex compatibility modules with a small integration API"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "macros", "rt"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1"
url = "2"
log = "0.4"

[dev-dependencies]
base64 = "0.22"
